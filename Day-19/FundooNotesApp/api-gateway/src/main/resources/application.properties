spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=note-service-notes
spring.cloud.gateway.routes[1].uri=lb://NOTE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/notes/**

spring.cloud.gateway.routes[2].id=label-service
spring.cloud.gateway.routes[2].uri=lb://LABEL-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/labels/**

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[4].id=reminder-service
spring.cloud.gateway.routes[4].uri=lb://REMINDER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/reminders/**
